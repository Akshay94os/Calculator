<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --surface2: #1c1c22;
    --border: #2a2a35;
    --display-bg: #080810;
    --text-primary: #e8e8f0;
    --text-secondary: #7070a0;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #7c3aed;
    --btn-num: #1a1a22;
    --btn-num-hover: #242430;
    --btn-op: #1e1228;
    --btn-op-hover: #2a1a38;
    --btn-fn: #0f1a20;
    --btn-fn-hover: #162430;
    --btn-eq: #00d4ff;
    --btn-eq-hover: #00eeff;
    --btn-eq-text: #000;
    --shadow: rgba(0, 212, 255, 0.15);
    --glow: 0 0 20px rgba(0, 212, 255, 0.3);
    --text-display: #00d4ff;
    --text-sub: #7070a0;
    --btn-clear: #ff3d5a;
    --grid-line: rgba(0,212,255,0.04);
  }
  [data-theme="light"] {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #f5f6fc;
    --border: #dde0f0;
    --display-bg: #e8eaf8;
    --text-primary: #1a1a2e;
    --text-secondary: #6060a0;
    --accent: #4f46e5;
    --accent2: #e25822;
    --accent3: #7c3aed;
    --btn-num: #ffffff;
    --btn-num-hover: #f0f2ff;
    --btn-op: #f0ecff;
    --btn-op-hover: #e8e0ff;
    --btn-fn: #e8f4ff;
    --btn-fn-hover: #d8ecff;
    --btn-eq: #4f46e5;
    --btn-eq-hover: #6057ee;
    --btn-eq-text: #fff;
    --shadow: rgba(79, 70, 229, 0.15);
    --glow: 0 4px 20px rgba(79, 70, 229, 0.2);
    --text-display: #4f46e5;
    --text-sub: #8080b0;
    --btn-clear: #e53e3e;
    --grid-line: rgba(79,70,229,0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    transition: background 0.4s ease;
    overflow: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    transition: background-image 0.4s;
  }
  .bg-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; z-index: 0; }
  .bg-glow.g1 { background: var(--accent); top: -100px; left: -100px; }
  .bg-glow.g2 { background: var(--accent3); bottom: -100px; right: -100px; }
  .calc-wrapper { position: relative; z-index: 1; animation: float-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes float-in { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .calculator {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 20px;
    width: 380px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4), var(--glow);
    transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
  }
  .calc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .calc-title { font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700; letter-spacing: 4px; color: var(--text-secondary); text-transform: uppercase; }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px; display: flex; gap: 2px; cursor: pointer; transition: all 0.3s; }
  .theme-btn { width: 28px; height: 22px; border-radius: 14px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.3s; color: var(--text-secondary); }
  .theme-btn.active { background: var(--accent); color: #000; }
  [data-theme="light"] .theme-btn.active { color: #fff; }
  .display {
    background: var(--display-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    min-height: 100px;
    display: flex; flex-direction: column; justify-content: flex-end;
    overflow: hidden; position: relative; transition: background 0.4s;
  }
  .display::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.5; }
  .display-expression { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--text-sub); text-align: right; min-height: 18px; word-break: break-all; transition: all 0.2s; }
  .display-main { font-family: 'Orbitron', monospace; font-size: 32px; font-weight: 700; color: var(--text-display); text-align: right; word-break: break-all; transition: all 0.15s; text-shadow: 0 0 20px rgba(0,212,255,0.3); }
  [data-theme="light"] .display-main { text-shadow: 0 2px 8px rgba(79,70,229,0.2); }
  .display-main.pop { animation: pop 0.12s ease; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .mode-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .mode-btn { flex: 1; padding: 5px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-secondary); font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px; cursor: pointer; transition: all 0.25s; }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  [data-theme="light"] .mode-btn.active { color: #fff; }
  .btn-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .btn {
    position: relative; padding: 0; height: 48px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--btn-num); color: var(--text-primary); font-family: 'Share Tech Mono', monospace;
    font-size: 13px; cursor: pointer; overflow: hidden;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s, border-color 0.15s;
    display: flex; align-items: center; justify-content: center; line-height: 1; user-select: none;
  }
  .btn:hover { background: var(--btn-num-hover); transform: translateY(-1px); }
  .btn:active { transform: scale(0.94); }
  .btn.fn { background: var(--btn-fn); font-size: 11px; color: #5bc0de; }
  .btn.fn:hover { background: var(--btn-fn-hover); }
  [data-theme="light"] .btn.fn { color: #0369a1; }
  .btn.op { background: var(--btn-op); color: #c084fc; font-size: 18px; font-family: 'Orbitron', monospace; }
  .btn.op:hover { background: var(--btn-op-hover); }
  [data-theme="light"] .btn.op { color: #7c3aed; }
  .btn.clear { background: rgba(255,61,90,0.1); border-color: rgba(255,61,90,0.3); color: var(--btn-clear); font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; }
  .btn.clear:hover { background: rgba(255,61,90,0.2); border-color: var(--btn-clear); }
  .btn.eq { background: var(--btn-eq); border-color: var(--btn-eq); color: var(--btn-eq-text); font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; box-shadow: 0 4px 15px rgba(0,212,255,0.3); }
  .btn.eq:hover { background: var(--btn-eq-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,212,255,0.4); }
  [data-theme="light"] .btn.eq { box-shadow: 0 4px 15px rgba(79,70,229,0.3); }
  .btn.zero { grid-column: span 2; }
  .btn.accent2 { color: var(--accent2); }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.15); transform: scale(0); animation: ripple-anim 0.4s linear; pointer-events: none; }
  @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .display.error { animation: shake 0.4s ease; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="calc-wrapper">
  <div class="calculator" id="calc">
    <div class="calc-header">
      <div class="calc-title">SCI &middot; CALC</div>
      <div class="theme-toggle">
        <button class="theme-btn active" id="darkBtn" onclick="setTheme('dark')" title="Dark">&#127769;</button>
        <button class="theme-btn" id="lightBtn" onclick="setTheme('light')" title="Light">&#9728;</button>
      </div>
    </div>
    <div class="display" id="display">
      <div class="display-expression" id="expr"></div>
      <div class="display-main" id="mainDisplay">0</div>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="modeDeg" onclick="setMode('DEG')">DEG</button>
      <button class="mode-btn" id="modeRad" onclick="setMode('RAD')">RAD</button>
      <button class="mode-btn" id="modeGrad" onclick="setMode('GRAD')">GRAD</button>
    </div>
    <div class="btn-grid" id="btnGrid">
      <button class="btn fn" onclick="inputFn('sin(')">sin</button>
      <button class="btn fn" onclick="inputFn('cos(')">cos</button>
      <button class="btn fn" onclick="inputFn('tan(')">tan</button>
      <button class="btn fn" onclick="inputFn('log(')">log</button>
      <button class="btn fn" onclick="inputFn('ln(')">ln</button>
      <button class="btn fn" onclick="inputFn('asin(')">sin&#8315;&#185;</button>
      <button class="btn fn" onclick="inputFn('acos(')">cos&#8315;&#185;</button>
      <button class="btn fn" onclick="inputFn('atan(')">tan&#8315;&#185;</button>
      <button class="btn fn" onclick="inputFn('sqrt(')">&#8730;</button>
      <button class="btn fn" onclick="inputFn('cbrt(')">&#8731;</button>
      <button class="btn fn" onclick="inputFn('abs(')">|x|</button>
      <button class="btn fn" onclick="inputFn('PI')">&#960;</button>
      <button class="btn fn" onclick="inputFn('E')">e</button>
      <button class="btn fn" onclick="inputFn('^2')">x&#178;</button>
      <button class="btn fn" onclick="inputFn('^')">x&#8319;</button>
      <button class="btn fn" onclick="inputFn('fact(')">n!</button>
      <button class="btn fn" onclick="inputFn('1/(')">1/x</button>
      <button class="btn fn" onclick="inputFn('exp(')">e&#739;</button>
      <button class="btn fn" onclick="inputFn('10^(')">10&#739;</button>
      <button class="btn fn" onclick="toggleSign()">&plusmn;</button>
      <button class="btn clear" onclick="clearAll()">AC</button>
      <button class="btn clear" style="font-size:11px;" onclick="clearEntry()">CE</button>
      <button class="btn op accent2" onclick="backspace()">&#9003;</button>
      <button class="btn op" onclick="inputOp('%')">%</button>
      <button class="btn op" onclick="inputOp('/')">&#247;</button>
      <button class="btn" onclick="inputNum('7')">7</button>
      <button class="btn" onclick="inputNum('8')">8</button>
      <button class="btn" onclick="inputNum('9')">9</button>
      <button class="btn op" onclick="inputOp('*')">&times;</button>
      <button class="btn fn" onclick="inputFn('(')">(</button>
      <button class="btn" onclick="inputNum('4')">4</button>
      <button class="btn" onclick="inputNum('5')">5</button>
      <button class="btn" onclick="inputNum('6')">6</button>
      <button class="btn op" onclick="inputOp('-')">&#8722;</button>
      <button class="btn fn" onclick="inputFn(')')">)</button>
      <button class="btn" onclick="inputNum('1')">1</button>
      <button class="btn" onclick="inputNum('2')">2</button>
      <button class="btn" onclick="inputNum('3')">3</button>
      <button class="btn op" onclick="inputOp('+')">+</button>
      <button class="btn eq" onclick="calculate()" style="grid-row: span 2;">=</button>
      <button class="btn zero" onclick="inputNum('0')">0</button>
      <button class="btn" onclick="inputDot()">.</button>
      <button class="btn fn" onclick="inputFn('EE')">EE</button>
    </div>
  </div>
</div>
<script>
  let expression = '';
  let justEvaluated = false;
  let angleMode = 'DEG';
  const mainDisplay = document.getElementById('mainDisplay');
  const exprDisplay = document.getElementById('expr');
  const displayEl = document.getElementById('display');

  function toAngle(v) {
    if (angleMode==='DEG') return v*Math.PI/180;
    if (angleMode==='GRAD') return v*Math.PI/200;
    return v;
  }
  function fromAngle(v) {
    if (angleMode==='DEG') return v*180/Math.PI;
    if (angleMode==='GRAD') return v*200/Math.PI;
    return v;
  }
  function fact(n) {
    n=Math.floor(Math.abs(n));
    if(n>170) return Infinity;
    if(n<=1) return 1;
    let r=1; for(let i=2;i<=n;i++) r*=i; return r;
  }
  function updateDisplay(val) {
    mainDisplay.classList.remove('pop');
    void mainDisplay.offsetWidth;
    mainDisplay.classList.add('pop');
    mainDisplay.textContent = val;
  }
  function inputNum(n) {
    if(justEvaluated){expression='';justEvaluated=false;}
    if(expression==='0'&&n!=='.') expression='';
    expression+=n;
    exprDisplay.textContent='';
    updateDisplay(expression);
  }
  function inputDot() {
    if(justEvaluated){expression='0';justEvaluated=false;}
    const parts=expression.split(/[\+\-\*\/\(]/);
    const last=parts[parts.length-1];
    if(last.includes('.')) return;
    if(!last||isNaN(last)) expression+='0';
    expression+='.';
    updateDisplay(expression);
  }
  function inputOp(op) {
    justEvaluated=false;
    const last=expression.slice(-1);
    if(['+','-','*','/','%'].includes(last)) expression=expression.slice(0,-1);
    expression+=op;
    mainDisplay.classList.remove('pop');void mainDisplay.offsetWidth;mainDisplay.classList.add('pop');
    mainDisplay.textContent=expression.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−');
  }
  function inputFn(fn) {
    if(justEvaluated) justEvaluated=false;
    if(fn==='PI'){expression+='Math.PI';updateDisplay('…π');exprDisplay.textContent=expression;return;}
    if(fn==='E'){expression+='Math.E';updateDisplay('…e');exprDisplay.textContent=expression;return;}
    if(fn==='EE'){expression+='e';updateDisplay(expression);return;}
    expression+=fn;
    updateDisplay(expression);
  }
  function toggleSign() {
    if(!expression||expression==='0') return;
    if(expression.startsWith('-')) expression=expression.slice(1);
    else expression='-'+expression;
    updateDisplay(expression);
  }
  function backspace() {
    if(justEvaluated){clearAll();return;}
    expression=expression.slice(0,-1);
    updateDisplay(expression||'0');
  }
  function clearEntry() {
    expression=expression.replace(/[\d\.]+$/,'')||'';
    updateDisplay(expression||'0');
  }
  function clearAll() {
    expression='';justEvaluated=false;
    exprDisplay.textContent='';
    updateDisplay('0');
  }
  function calculate() {
    if(!expression) return;
    try {
      let expr=expression;
      exprDisplay.textContent=expr.replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−')+' =';
      expr=expr.replace(/\bsin\(/g,'_sin(').replace(/\bcos\(/g,'_cos(').replace(/\btan\(/g,'_tan(');
      expr=expr.replace(/\basin\(/g,'_asin(').replace(/\bacos\(/g,'_acos(').replace(/\batan\(/g,'_atan(');
      expr=expr.replace(/\bsqrt\(/g,'Math.sqrt(').replace(/\bcbrt\(/g,'Math.cbrt(');
      expr=expr.replace(/\blog\(/g,'Math.log10(').replace(/\bln\(/g,'Math.log(');
      expr=expr.replace(/\babs\(/g,'Math.abs(').replace(/\bexp\(/g,'Math.exp(');
      expr=expr.replace(/\bfact\(/g,'_fact(').replace(/\b10\^\(/g,'(Math.pow(10,');
      expr=expr.replace(/\^/g,'**').replace(/%/g,'/100');
      const _sin=v=>Math.sin(toAngle(v)), _cos=v=>Math.cos(toAngle(v)), _tan=v=>Math.tan(toAngle(v));
      const _asin=v=>fromAngle(Math.asin(v)), _acos=v=>fromAngle(Math.acos(v)), _atan=v=>fromAngle(Math.atan(v));
      const _fact=fact;
      let result=Function('_sin','_cos','_tan','_asin','_acos','_atan','_fact','"use strict";return('+expr+');')(_sin,_cos,_tan,_asin,_acos,_atan,_fact);
      if(typeof result!=='number'||isNaN(result)) throw new Error('NaN');
      if(!isFinite(result)) throw new Error('Inf');
      let formatted;
      if(Math.abs(result)>=1e15||(Math.abs(result)<1e-10&&result!==0)) formatted=result.toExponential(6);
      else formatted=parseFloat(result.toPrecision(12)).toString();
      expression=formatted; justEvaluated=true;
      updateDisplay(formatted);
    } catch(e) {
      displayEl.classList.remove('error');void displayEl.offsetWidth;displayEl.classList.add('error');
      exprDisplay.textContent=expression;
      updateDisplay('Error');
      expression='';justEvaluated=false;
    }
  }
  function setMode(m) {
    angleMode=m;
    ['Deg','Rad','Grad'].forEach(x=>document.getElementById('mode'+x).classList.toggle('active',x.toUpperCase()===m));
  }
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme',t==='light'?'light':'');
    document.getElementById('darkBtn').classList.toggle('active',t==='dark');
    document.getElementById('lightBtn').classList.toggle('active',t==='light');
  }
  document.getElementById('btnGrid').addEventListener('click',function(e){
    const btn=e.target.closest('.btn');
    if(!btn) return;
    const r=document.createElement('span');
    r.className='ripple';
    const rect=btn.getBoundingClientRect();
    const size=Math.max(rect.width,rect.height);
    r.style.cssText='width:'+size+'px;height:'+size+'px;left:'+(e.clientX-rect.left-size/2)+'px;top:'+(e.clientY-rect.top-size/2)+'px';
    btn.appendChild(r);
    setTimeout(()=>r.remove(),500);
  });
  document.addEventListener('keydown',function(e){
    if(e.key>='0'&&e.key<='9') inputNum(e.key);
    else if(e.key==='.') inputDot();
    else if(e.key==='+') inputOp('+');
    else if(e.key==='-') inputOp('-');
    else if(e.key==='*') inputOp('*');
    else if(e.key==='/'){e.preventDefault();inputOp('/');}
    else if(e.key==='Enter'||e.key==='=') calculate();
    else if(e.key==='Backspace') backspace();
    else if(e.key==='Escape') clearAll();
    else if(e.key==='(') inputFn('(');
    else if(e.key===')') inputFn(')');
    else if(e.key==='%') inputOp('%');
  });
</script>
</body>
</html>
